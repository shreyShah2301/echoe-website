<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="canonical" href="https://echoeapp.com/privacy">

  <style>
    html, body { margin: 0; padding: 0; }
    body { background: var(--ivory); color: var(--ink); overflow-x: hidden; }
    *, *::before, *::after { box-sizing: border-box; }
    .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 32px; box-sizing: border-box; }
    @media (max-width: 720px) { .container { padding: 0 28px; } }
    .eyebrow { font: 500 11px/1.4 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--terracotta); }
    ::selection { background: rgba(47, 95, 61, 0.25); color: var(--ink); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
