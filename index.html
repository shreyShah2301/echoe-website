  <!-- Structured data. Static in <head> so it lands in the prerendered HTML
       (scripts/prerender.mjs only injects into <div id="app">, never the head).
       FAQPage mirrors the 6 questions in src/components/Rest.jsx — keep in sync. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Echoe",
    "operatingSystem": "macOS 14.0 or later",
    "applicationCategory": "ProductivityApplication",
    "description": "Voice dictation for Mac built for Indian voices. Speak in Hindi, English, or Hinglish — Echoe types clean text wherever your cursor is.",
    "offers": {
      "@type": "AggregateOffer",
      "lowPrice": "0",
      "highPrice": "3999",
      "priceCurrency": "INR"
    },
    "downloadUrl": "https://github.com/shreyShah2301/echoe-website/releases/download/v1.1.3/Echoe-1.1.3.dmg",
    "softwareVersion": "1.1.3",
    "author": { "@type": "Organization", "name": "Echoe" }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Is my audio sent to a server?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Audio is briefly stored on our servers for up to one hour to enable retries and quality monitoring, then automatically deleted. We never read its contents — it exists only to be processed by Sarvam AI for transcription. Full details on our Privacy page."
        }
      },
      {
        "@type": "Question",
        "name": "Does this work in WhatsApp Web?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Echoe types into any text field your cursor is in, including WhatsApp Web, Slack, Gmail, Figma, terminals, and AI chat tools like ChatGPT and Claude."
        }
      },
      {
        "@type": "Question",
        "name": "What if I have an Intel Mac?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Apple Silicon and Intel are both supported. macOS 14+ required."
        }
      },
      {
        "@type": "Question",
        "name": "Does Echoe train AI on my data?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Your transcripts are not used to train any model, ours or third-party. See our privacy page for details."
        }
      },
      {
        "@type": "Question",
        "name": "Where does my dictation text live?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "On your Mac, in a local database that only your macOS account can read. (Technical readers: full path is ~/Library/Application Support/Echoe/echoe.sqlite.) The transcript and polished output travel from our server to your Mac in the HTTP response and are never written to our database. Our server only records metadata: duration, language detected, and whether the request succeeded."
        }
      },
      {
        "@type": "Question",
        "name": "Can the Echoe team read my dictations?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. We have no access to dictation text — not even for our own beta testers. Our server logs contain timestamps, durations, and error codes, never what you said. The only copy of your dictations is on your own Mac."
        }
      }
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Echoe",
    "url": "https://echoeapp.com",
    "logo": "https://echoeapp.com/echoe-wordmark.svg",
    "sameAs": ["https://x.com/shreyshah2301"]
  }
  </script>

  <style>
    html, body { margin: 0; padding: 0; }
    body { background: var(--ivory); color: var(--ink); overflow-x: hidden; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; }

    section { padding: 120px 0; position: relative; }
    @media (max-width: 720px) { section { padding: 72px 0; } }
    .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 32px; box-sizing: border-box; }
    @media (max-width: 720px) { .container { padding: 0 28px; } }

    /* 2x2 on desktop, 1 col on mobile. Prevents an orphaned 4th card.
       minmax(0, 1fr) on mobile lets the column shrink below content
       min-width — necessary because Card 2 contains a fixed-width HUD
       (320px) that would otherwise push the card past the container. */
    .mechanic-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media (max-width: 720px) {
      .mechanic-grid { grid-template-columns: minmax(0, 1fr); }
    }

    /* 4-up on desktop, 2x2 on tablet, stacked on mobile. */
    .pricing-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    @media (max-width: 1080px) {
      .pricing-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 540px) {
      .pricing-grid { grid-template-columns: 1fr; }
    }

    /* Demo scenario picker. Desktop: free-flowing pills, full info.
       Mobile: 2x2 grid with logo + app name only (title + subtitle hide). */
    .scenario-picker {
      margin-top: 40px;
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .scenario-btn {
      background: transparent;
      border: 0.5px solid var(--hairline-stronger);
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      text-align: left;
      display: flex; flex-direction: column; gap: 4px;
      color: var(--ink);
      min-width: 170px;
      font-family: inherit;
    }
    .scenario-btn.is-active {
      background: var(--ivory);
      border-color: var(--ink);
    }
    .scenario-tag-row {
      display: flex; align-items: center; gap: 8px;
    }
    .scenario-app {
      font: 500 10px/1 var(--font-ui);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dust);
    }
    .scenario-app.is-active { color: var(--terracotta); }
    .scenario-title {
      font: 500 14px/1.3 var(--font-ui);
    }
    .scenario-subtitle {
      font: 400 12px/1.3 var(--font-ui);
      color: var(--sepia);
    }
    @media (max-width: 720px) {
      .scenario-picker {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .scenario-btn {
        min-width: 0;
        padding: 10px 12px;
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
      .scenario-tag-row {
        flex: 1; min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .scenario-app {
        font-size: 11px;
        letter-spacing: 0.1em;
      }
      .scenario-title,
      .scenario-subtitle {
        display: none;
      }
    }

    .eyebrow {
      font: 500 11px/1.4 var(--font-ui); letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--terracotta);
    }
    .h2 {
      font: 500 clamp(34px, 5.5vw, 56px)/1.05 var(--font-ui);
      letter-spacing: -0.025em; color: var(--ink); margin: 14px 0 0;
      text-wrap: balance;
    }
    .lede {
      font: 400 clamp(15px, 1.4vw, 17px)/1.6 var(--font-ui);
      letter-spacing: -0.005em; color: var(--sepia);
      max-width: 620px; margin-top: 18px; text-wrap: pretty;
    }

    @keyframes wa-caret { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .typing-caret {
      display: inline-block; width: 1.5px; height: 1em; background: currentColor;
      vertical-align: -0.15em; margin-left: 1px;
      animation: wa-caret 1s step-end infinite;
    }

    @keyframes hud-wave-anim { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

    /* Top-of-page header. Non-sticky: it sits above the hero and scrolls away
       with it. The slim sticky bar (.sticky-bar, slides in once the hero exits)
       takes over persistent nav duty — see StickyBarEN in Hero.jsx. */
    .nav {
      position: relative; z-index: 50;
      background: rgba(245, 241, 232, 0.85); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 0.5px solid transparent;
    }

    /* Slim sticky download bar. Hidden by default (translated up) so the
       prerendered static HTML ships it off-screen with no layout shift; the
       IntersectionObserver in StickyBarEN adds .is-visible after the hero
       scrolls out of view. position: fixed + transform = zero reflow. */
    .sticky-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      background: rgba(245, 241, 232, 0.9);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 0.5px solid var(--hairline);
      transform: translateY(-100%);
      transition: transform 260ms var(--ease-default);
      padding-top: env(safe-area-inset-top);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .sticky-bar.is-visible { transform: translateY(0); }
    .sticky-bar-row {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; gap: 16px;
    }

    /* Nav layout — desktop default, mobile collapses to logo + CTA only. */
    .nav-row {
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; gap: 16px;
    }
    .nav-actions {
      display: flex; align-items: center; gap: 22px;
      min-width: 0;
    }
    .nav-link {
      font: 400 14px/1 var(--font-ui);
      color: var(--sepia);
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--ink); }
    @media (max-width: 720px) {
      .nav-row { height: 56px; }
      .nav-actions { gap: 12px; }
      .nav-link { display: none; }
    }

    ::selection { background: rgba(47, 95, 61, 0.25); color: var(--ink); }

    /* Waitlist form placeholder: dark grey, legible. opacity: 1 defeats the
       browser's default placeholder fade (Firefox applies ~0.54 opacity by
       default). On-dark variant lives in WaitlistForm.jsx via the .on-dark
       modifier. */
    .echoe-waitlist-input::placeholder {
      color: #333333;
      opacity: 1;
    }
    .echoe-waitlist-input.on-dark::placeholder {
      color: rgba(245, 241, 232, 0.6);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="max-width:620px;margin:80px auto;padding:32px;font:400 16px/1.6 var(--font-ui);color:var(--sepia);text-align:center">
      <strong style="color:var(--ink);font-weight:500">Echoe</strong>, voice dictation for Mac. <a href="mailto:hello@echoeapp.com" style="color:var(--terracotta)">Get early access</a>.
    </div>
  </noscript>
  <div id="app"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
