<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Echoe. Stop typing. Start speaking.</title>
  <meta name="description" content="Voice dictation for Mac that hears how Indians talk and types how Indians need. Speak in Hindi, English, Hinglish, or any Indian language. Get clean text in Slack, WhatsApp, Gmail, anywhere your cursor is.">

  <link rel="canonical" href="https://echoeapp.com/">
  <!-- 16px-optimized SVG favicon (stroke widths designed for tab-size rendering). -->
  <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon.svg">
  <!-- 32px-optimized SVG (slightly heavier strokes for retina/larger renders). -->
  <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon-32.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Echoe">
  <meta property="og:url" content="https://echoeapp.com/">
  <meta property="og:title" content="Echoe. Stop typing. Start speaking.">
  <meta property="og:description" content="Hears how Indians talk. Types how Indians need.">
  <meta property="og:image" content="https://echoeapp.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://echoeapp.com/">
  <meta name="twitter:title" content="Echoe. Stop typing. Start speaking.">
  <meta name="twitter:description" content="Hears how Indians talk. Types how Indians need.">
  <meta name="twitter:image" content="https://echoeapp.com/og-image.png">

  <style>
    html, body { margin: 0; padding: 0; }
    body { background: var(--ivory); color: var(--ink); overflow-x: hidden; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; }

    section { padding: 120px 0; position: relative; }
    @media (max-width: 720px) { section { padding: 72px 0; } }
    .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 32px; }
    @media (max-width: 720px) { .container { padding: 0 22px; } }

    /* 2x2 on desktop, 1 col on mobile. Prevents an orphaned 4th card. */
    .mechanic-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media (max-width: 720px) {
      .mechanic-grid { grid-template-columns: 1fr; }
    }

    /* 4-up on desktop, 2x2 on tablet, stacked on mobile. */
    .pricing-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    @media (max-width: 1080px) {
      .pricing-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 540px) {
      .pricing-grid { grid-template-columns: 1fr; }
    }

    .eyebrow {
      font: 500 11px/1.4 var(--font-ui); letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--terracotta);
    }
    .h2 {
      font: 500 clamp(34px, 5.5vw, 56px)/1.05 var(--font-ui);
      letter-spacing: -0.025em; color: var(--ink); margin: 14px 0 0;
      text-wrap: balance;
    }
    .lede {
      font: 400 clamp(15px, 1.4vw, 17px)/1.6 var(--font-ui);
      letter-spacing: -0.005em; color: var(--sepia);
      max-width: 620px; margin-top: 18px; text-wrap: pretty;
    }

    @keyframes wa-caret { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .typing-caret {
      display: inline-block; width: 1.5px; height: 1em; background: currentColor;
      vertical-align: -0.15em; margin-left: 1px;
      animation: wa-caret 1s step-end infinite;
    }

    @keyframes hud-wave-anim { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

    .nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(245, 241, 232, 0.85); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 0.5px solid transparent;
      transition: border-color 200ms var(--ease-default), background 200ms var(--ease-default);
    }
    .nav.scrolled { border-bottom-color: var(--hairline); }

    ::selection { background: rgba(47, 95, 61, 0.25); color: var(--ink); }

    /* Waitlist form placeholder: dark grey, legible. opacity: 1 defeats the
       browser's default placeholder fade (Firefox applies ~0.54 opacity by
       default). On-dark variant lives in WaitlistForm.jsx via the .on-dark
       modifier. */
    .echoe-waitlist-input::placeholder {
      color: #333333;
      opacity: 1;
    }
    .echoe-waitlist-input.on-dark::placeholder {
      color: rgba(245, 241, 232, 0.6);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <noscript>
      <div style="max-width:620px;margin:80px auto;padding:32px;font:400 16px/1.6 var(--font-ui);color:var(--sepia);text-align:center">
        <strong style="color:var(--ink);font-weight:500">Echoe</strong>, voice dictation for Mac. <a href="mailto:hello@echoeapp.com" style="color:var(--terracotta)">Get early access</a>.
      </div>
    </noscript>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
