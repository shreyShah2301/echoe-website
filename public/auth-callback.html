<!DOCTYPE html>
<html>
<head>
  <title>Signing you in to Echoe...</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #FFFFF5; color: #1E140A; }
    p { font-size: 18px; }
  </style>
</head>
<body>
  <p>Signing you in to Echoe...</p>
  <script>
    // Forward everything (hash fragment + query params) to the Windows app
    const hash = window.location.hash;
    const search = window.location.search;
    const redirect = 'echoe://auth/callback' + search + hash;
    window.location.href = redirect;
  </script>
</body>
</html>
