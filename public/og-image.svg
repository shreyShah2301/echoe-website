<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F1E8"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1C1A15" stroke-opacity="0.08"/>

  <!-- Logo (top-left). Canonical wordmark scaled 1.5x from source 360x80. -->
  <g transform="translate(72, 50) scale(1.5)">
    <line x1="40" y1="22" x2="64" y2="22" stroke="#1C1A15" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="52" cy="46" r="14" fill="#1C1A15"/>
    <circle cx="52" cy="46" r="5.5" fill="#C97B3F"/>
    <text x="92" y="56" font-family="Inter, -apple-system, sans-serif" font-size="34" font-weight="500" fill="#1C1A15" letter-spacing="-1.02">echoe</text>
  </g>

  <!-- H1 line 1 -->
  <text x="72" y="280" font-family="Inter, -apple-system, sans-serif" font-size="80" font-weight="500" fill="#1C1A15" letter-spacing="-2.4">Stop typing.</text>

  <!-- H1 line 2 with "speaking." in terracotta orange -->
  <text x="72" y="370" font-family="Inter, -apple-system, sans-serif" font-size="80" font-weight="500" fill="#1C1A15" letter-spacing="-2.4">Start <tspan fill="#C97B3F">speaking.</tspan></text>

  <!-- Sub -->
  <text x="72" y="420" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#6B5D42">Hears how Indians talk. Types how Indians need.</text>

  <!-- Hotkey pill -->
  <g transform="translate(72, 510)">
    <rect width="148" height="42" rx="6" fill="#FFFFFF" stroke="#1C1A15" stroke-opacity="0.15"/>
    <text x="74" y="29" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" font-weight="500" fill="#1C1A15">right ⌘</text>
  </g>
  <text x="240" y="538" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6B5D42">Hold. Talk. Release.</text>

  <!-- Demo card (right side, 408x316, vertically centered) -->
  <g transform="translate(720, 157)">
    <rect width="408" height="316" rx="16" fill="#FFFFFF" stroke="#1C1A15" stroke-opacity="0.08"/>

    <!-- "YOU SAID" tag -->
    <rect x="24" y="24" width="84" height="22" rx="4" fill="#EDE7D8"/>
    <text x="66" y="38" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#6B5D42" letter-spacing="0.8">YOU SAID</text>

    <!-- Devanagari text -->
    <text x="24" y="82" font-family="Noto Sans Devanagari, Inter, sans-serif" font-size="20" font-weight="400" fill="#1C1A15">यार timeline नहीं बन रहा,</text>
    <text x="24" y="110" font-family="Noto Sans Devanagari, Inter, sans-serif" font-size="20" font-weight="400" fill="#1C1A15">एक हफ्ता और चाहिए।</text>

    <!-- Divider -->
    <line x1="24" y1="160" x2="384" y2="160" stroke="#1C1A15" stroke-opacity="0.08"/>

    <!-- "TYPED IN HINGLISH" tag -->
    <rect x="24" y="184" width="148" height="22" rx="4" fill="#C97B3F"/>
    <text x="98" y="198" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#F5F1E8" letter-spacing="0.8">TYPED IN HINGLISH</text>

    <!-- Hinglish text -->
    <text x="24" y="244" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="500" fill="#1C1A15">Yaar timeline nahi ban raha,</text>
    <text x="24" y="270" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="500" fill="#1C1A15">ek hafta aur chahiye.</text>
  </g>
</svg>
