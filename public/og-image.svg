<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE7D8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Hairline border -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1C1A15" stroke-opacity="0.08"/>

  <!-- Wordmark lockup -->
  <g transform="translate(120, 240)">
    <circle cx="42" cy="62" r="42" fill="#1C1A15"/>
    <text x="108" y="86" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="116" font-weight="500" letter-spacing="-3" fill="#1C1A15">Echoe</text>
  </g>

  <!-- Tagline -->
  <text x="120" y="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42" font-weight="400" letter-spacing="-1" fill="#1C1A15">Dictate everywhere on Mac.</text>
  <text x="120" y="450" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="42" font-weight="400" letter-spacing="-1" fill="#6B5D42">Hinglish included.</text>

  <!-- Right ⌘ chip -->
  <g transform="translate(120, 510)">
    <rect width="148" height="42" rx="6" fill="#FFFFFF" stroke="#1C1A15" stroke-opacity="0.15"/>
    <text x="74" y="29" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="16" font-weight="500" fill="#1C1A15">right ⌘</text>
  </g>
  <text x="288" y="538" font-family="Inter, sans-serif"
        font-size="20" font-weight="400" fill="#6B5D42">Hold, talk, release.</text>
</svg>
