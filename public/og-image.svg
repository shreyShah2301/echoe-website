<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#EDE7D8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Hairline border -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1C1A15" stroke-opacity="0.08"/>

  <!-- Canonical wordmark, scaled 2.4x from the source 360x80. -->
  <g transform="translate(120, 130) scale(2.4)">
    <line x1="40" y1="22" x2="64" y2="22" stroke="#1C1A15" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="52" cy="46" r="14" fill="#1C1A15"/>
    <circle cx="52" cy="46" r="5.5" fill="#C97B3F"/>
    <text x="92" y="56" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="34" font-weight="500" fill="#1C1A15" letter-spacing="-1.02">echoe</text>
  </g>

  <!-- Tagline -->
  <text x="120" y="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="52" font-weight="500" letter-spacing="-1.5" fill="#1C1A15">Your thoughts in your language.</text>
  <text x="120" y="456" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="32" font-weight="400" letter-spacing="-0.5" fill="#6B5D42">Voice dictation for Mac.</text>

  <!-- Right ⌘ chip -->
  <g transform="translate(120, 520)">
    <rect width="148" height="42" rx="6" fill="#FFFFFF" stroke="#1C1A15" stroke-opacity="0.15"/>
    <text x="74" y="29" text-anchor="middle"
          font-family="JetBrains Mono, ui-monospace, monospace"
          font-size="16" font-weight="500" fill="#1C1A15">right ⌘</text>
  </g>
  <text x="288" y="548" font-family="Inter, sans-serif"
        font-size="20" font-weight="400" fill="#6B5D42">Hold, talk, release.</text>
</svg>
